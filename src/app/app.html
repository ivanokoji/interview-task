<main class="converter-container">
  <header>
    <h1>Image to Text Converter</h1>
    <p>Upload JPEG or PNG image (max 2MB) to extract text.</p>
  </header>

  <section class="upload-section">

    <input type="file" accept="image/jpeg, image/png" id="fileUpload"/>
    <label for="fileUpload" class="upload-button">Select Image</label>
  </section>

  <section class="preview-section">
    <div class="image-placeholder">No image selected</div>
  </section>

  <section class="result-section">
    <textarea readonly placeholder="Extracted text will appear here..."></textarea>
    <button class="copy-button" disabled>Copy to Clipboard</button>
  </section>
</main>
